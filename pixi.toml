[workspace]
name = "circc"
version = "0.1.0"
description = "A CIR to C translator"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
clang = "==23.1.2"
clangxx = "==23.1.2"
lld = "==23.1.2"
llvm-tools = "==23.1.2"
zlib = ">=1.3.2,<2"
libxml2-devel = ">=2.15.4,<3"
cmake = ">=3.31,<5"
ninja = ">=1.13,<2"
git = ">=2.50,<3"
sccache = ">=0.10,<1"
python = "3.13.*"
pyyaml = ">=6,<7"
pygments = ">=2.19,<3"

[target.osx-arm64.dependencies]
libedit = ">=3.1,<4"

[tasks]
fetch-llvm = "python scripts/fetch_llvm.py"
configure = { cmd = "cmake -G Ninja -S .deps/llvm-project/llvm -B build -C cmake/caches/LLVM.cmake", depends-on = ["fetch-llvm"], inputs = ["pixi.toml", "pixi.lock", "scripts/fetch_llvm.py", "CMakeLists.txt", "cmake/**/*.cmake", "lib/**/CMakeLists.txt", "tools/**/CMakeLists.txt", "test/CMakeLists.txt", "test/lit.site.cfg.py.in"], outputs = ["build/CMakeCache.txt", "build/build.ninja"] }
build = { cmd = "cmake --build build --target circc", depends-on = ["configure"] }
build-clang = { cmd = "cmake --build build --target clang", depends-on = ["configure"] }
clang-cir = "build/bin/clang"
circc = "build/bin/circc"
tests = { cmd = "cmake --build build --target check-circc", depends-on = ["build"] }
build-test-tools = { cmd = "cmake --build build --target FileCheck not", depends-on = ["build"] }
test = { cmd = "python build/bin/llvm-lit.py -sv", depends-on = ["build-test-tools"], description = "Run selected regression test files or directories" }
