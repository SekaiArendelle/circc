[workspace]
name = "circc"
version = "0.1.0"
description = "A CIR to C translator"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
clang = "==23.1.2"
clangxx = "==23.1.2"
lld = "==23.1.2"
llvmdev = "==23.1.2"
zlib = ">=1.3.2,<2"
libxml2-devel = ">=2.15.4,<3"
cmake = ">=3.31,<5"
ninja = ">=1.13,<2"
git = ">=2.50,<3"
sccache = ">=0.10,<1"
python = "3.13.*"
pyyaml = ">=6,<7"
pygments = ">=2.19,<3"

[tasks]
configure = "cmake --preset dev"
build = "cmake --build --preset dev"
test = "ctest --preset dev"
check = { depends-on = ["build", "test"] }

fetch-llvm = "git clone --filter=blob:none --depth 1 --branch llvmorg-23.1.2 https://github.com/llvm/llvm-project.git .deps/llvm-project"
configure-llvm = "cmake -G Ninja -S .deps/llvm-project/llvm -B build/llvm -C cmake/caches/LLVM.cmake"
build-llvm = "cmake --build build/llvm --target circc"
